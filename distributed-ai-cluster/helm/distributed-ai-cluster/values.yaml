# Default values for distributed-ai-cluster.
# Keys here are kept in sync with the chart templates. Run `helm lint` and
# `helm template .` after editing.

nameOverride: ""
fullnameOverride: ""
namespace: ""

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Scheduling (applied to both master and workers).
nodeSelector: {}
tolerations: []
affinity: {}

cluster:
  master:
    replicas: 1
    image:
      registry: docker.io
      # Override with your own image. Pin to an immutable tag (git SHA / semver),
      # not "latest", for reproducible, rollback-able deploys.
      repository: your-registry/distributed-ai-cluster
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    config:
      heartbeatInterval: 10
      maxWorkersPerNode: 4
      modelCacheSize: "2Gi"
      enableModelVersioning: true
    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

  workers:
    replicas: 4
    image:
      registry: docker.io
      repository: your-registry/distributed-ai-cluster
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    config:
      modelShardSize: "1Gi"
      maxConcurrentRequests: 16
      cacheEnabled: true
      enableGpuAcceleration: false
    resources:
      requests:
        memory: "4Gi"
        cpu: "2000m"
      limits:
        memory: "8Gi"
        cpu: "4000m"

  modelStorage:
    storageClass: "fast-ssd"
    size: "50Gi"
    accessModes:
      - ReadWriteMany

# Probes for the master container (workers define their own inline).
healthCheck:
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: ai-cluster.local
      paths:
        - path: /api
          pathType: Prefix
        - path: /dashboard
          pathType: Prefix
  tls: []
  # - secretName: ai-cluster-tls
  #   hosts:
  #     - ai-cluster.local

monitoring:
  enabled: true

logging:
  level: "INFO"
  format: "json"

security:
  networkPolicy:
    enabled: true
    allowFromNamespaces:
      - ingress-nginx
  rbac:
    create: true
    serviceAccount:
      annotations: {}

# Used by the serviceAccountName helper.
serviceAccount:
  create: true
  name: ""
