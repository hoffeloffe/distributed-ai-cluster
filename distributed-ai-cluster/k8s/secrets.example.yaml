# Example Secret manifest — DO NOT put real values here or commit a filled-in copy.
#
# Recommended approaches (pick one):
#
# 1) Imperative (simplest, nothing sensitive in git):
#      kubectl create secret generic ai-cluster-secrets \
#        --namespace distributed-ai \
#        --from-literal=database-password='<value>' \
#        --from-literal=jwt-secret='<value>'
#
# 2) Sealed Secrets (Bitnami) — encrypt, then commit the SealedSecret safely:
#      kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
# 3) External Secrets Operator — sync from a real secret store (Azure Key Vault,
#    AWS Secrets Manager, Vault, ...). The cluster pulls secrets at runtime.
#
# 4) Azure Key Vault Secrets Store CSI driver — mount Key Vault secrets as files
#    and/or sync them into a Kubernetes Secret.
#
# The structure the application expects:
apiVersion: v1
kind: Secret
metadata:
  name: ai-cluster-secrets
  namespace: distributed-ai
type: Opaque
stringData:
  database-password: "REPLACE_ME"
  jwt-secret: "REPLACE_ME"
